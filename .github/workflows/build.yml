name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pywebview pyinstaller

      - name: Build EXE
        run: |
          # 注意：Windows 下 --add-data 的参数分隔符是分号 ";"，表示把 index.html 打包到 exe 同级目录
          # 新增了 --collect-all pywebview 和 --hidden-import clr 来保证 pywebview 在 Windows 下完整打包
          pyinstaller -F -w --name AgnesCanvas --add-data "index.html;." --collect-all pywebview --hidden-import clr main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AgnesCanvas-windows
          path: dist/AgnesCanvas.exe
