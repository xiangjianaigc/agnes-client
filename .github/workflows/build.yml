name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyinstaller

      - name: Build EXE
        run: |
          pyinstaller -F -w --name AgnesClient agnes_client.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AgnesClient-windows
          path: dist/AgnesClient.exe
